# Configurações do Banco de Dados H2 (Modo Arquivo)
spring.datasource.url=jdbc:h2:file:./banco_saude/saudedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# update para garantir que as tabelas não sejam apagadas ao reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Configurações do Bot do Telegram
telegram.bot.username=COLOQUE_O_USERNAME_DO_SEU_BOT
telegram.bot.token=COLOQUE_SEU_TOKEN_AQUI